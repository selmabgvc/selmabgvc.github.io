<script>
const DATA = {"stations": [{"id": "login", "kapitel": "Prolog", "title": "Das Kennwort der Kartei", "place": "Altstädter Ring, am Jan-Hus-Denkmal", "paper": "Brief P0", "icon": "key", "scene": "Der Umschlag aus dem Wörterbuch hat euch hierher geführt. Die Kartei öffnet sich nur dem, der ihren Wahlspruch liest. Er steht auf dem Denkmal. Lest ihn dort ab, bevor ihr tippt.", "fields": [{"id": "w", "label": "Kennwort", "type": "text", "ph": "erstes Wort des Spruchs"}], "wrong": ["Falsches Wort. Der Spruch ist auf Tschechisch. Du brauchst nur das erste Wort."], "success": "Die Kartei öffnet sich. Willkommen, Archivar.", "unlock": [{"kind": "story", "title": "Prolog", "text": "Februar 1948, Prag. Die Buchbinderin Ludmila Ostrá beginnt, auf Karteikarten festzuhalten, was gewöhnliche Menschen erlebt haben. Die Kartei nimmt nur auf, was sich belegen lässt. Im November 1989 will ihr Funkpartner Vojtěch Kubát noch eine letzte Nachricht schicken. Sie kommt nie vollständig an. Heute fehlen sechs Wörter. Setzt sie zusammen."}, {"kind": "story", "title": "Hintergrund (historisch): Der Mann auf dem Sockel", "text": "Jan Hus, Prediger und Magister der Prager Universität, wurde am 6. Juli 1415 beim Konzil von Konstanz als Ketzer verbrannt. Für viele Tschechen wurde er zum Symbol für Wahrhaftigkeit und Gewissen. Das Denkmal auf dem Altstädter Ring schuf Ladislav Šaloun, enthüllt wurde es am 6. Juli 1915, zum 500. Todestag. Der Spruch, den ihr heute gelesen habt, wird Hus zugeschrieben und ist bis heute ein tschechischer Wahlspruch. Der Platz selbst war oft Bühne der Geschichte: Hinrichtungen, Feiern, Aufmärsche. Genau deshalb beginnt die Kartei hier."}], "nextplace": "Bleibt am Altstädter Ring. Der erste Zeugenzettel wartet.", "hints": ["Der Spruch steht auf dem Denkmal selbst, am Sockel. Er ist kurz.", "Der Spruch ist auf Tschechisch. Du brauchst nur das erste Wort.", "Es beginnt mit M und hat sieben Buchstaben."], "h": {"w": "3d7444c11a04c25af1f72599d3cd6248542c5aa0097daecebf066ddfef65bda9"}}, {"id": "st1", "kapitel": "Station 1", "title": "Der Balkon", "place": "Altstädter Ring, vor dem Palais Kinský", "paper": "Zeugenzettel Nr. 1 (P1)", "icon": "balcony", "scene": "1948 wurde auf diesem Platz ein Machtwechsel inszeniert. Selma holt den ersten Zeugenzettel aus dem Wörterbuch. Findet vor Ort den Balkon, von dem die Rede kam. Auf dem Zettel stimmt ein Datum nicht.", "fields": [{"id": "d", "label": "Datum der Balkonrede", "type": "date", "ph": "TT.MM.JJJJ"}], "wrong": ["Das war ein anderer Tag. Prüft den Wochentag."], "success": "Richtig. Ein Datum war falsch, und die Zeugin hat es nicht gemerkt. Das Fragment gehört euch.", "unlock": [{"kind": "fragment", "name": "DER BALKON", "group": "17"}, {"kind": "doc", "title": "Vermerk Dienststelle K-9 (1)", "text": "Die Gruppe „Moldau“ sammelt Namen. Es besteht der Verdacht, dass die Namen von Mitarbeitern der Sicherheitsorgane stammen. Maßnahme: Beobachtung."}, {"kind": "story", "title": "Hintergrund (historisch): Februar 1948", "text": "Im Februar 1948 trat die kommunistische Partei die Macht in der Tschechoslowakei an. Zwölf nichtkommunistische Minister reichten am 20. Februar ihren Rücktritt ein, Präsident Beneš nahm ihn am 25. Februar an. Dazwischen, am 21. Februar, sprach Klement Gottwald vor Tausenden auf dem Altstädter Ring. Der Platz war als Bühne gewählt: Kein Sturm auf das Parlament, sondern Volksfest und Druck der Straße. Danach folgten Verhaftungen, Säuberungen und Schauprozesse. Das Palais Kinský, vor dem ihr steht, gehört heute zur Nationalgalerie. Ludmilas Kartei beginnt in diesem Monat. Die Figuren und ihre Zettel sind erfunden, die Tage nicht."}], "nextplace": "Nächster Ort: Národní třída 16, Ecke Mikulandská.", "hints": ["Welcher Tag war das? Samstag. Welche Samstage hatte der Februar 1948? (7., 14., 21., 28.)", "Wann traten die zwölf Minister zurück? (20. Februar)", "Der Tag danach."], "h": {"d": "0cdf3c9f9039ec32b2a099cfbf2740600586ba488452543b04062a0cae00d801"}}, {"id": "st2", "kapitel": "Station 2", "title": "Die leeren Hände", "place": "Národní třída 16, Ecke Mikulandská", "paper": "Funkprotokoll (P2)", "icon": "hands", "scene": "Yvonne erzählt von Kubáts Protokoll über die Novembertage 1989. An der Fassade dieses Hauses hängt eine Bronzetafel. Löst das Funkprotokoll und zählt vor Ort die Hände.", "fields": [{"id": "w", "label": "Lösungswort", "type": "text", "ph": "ein Wort"}, {"id": "n", "label": "Anzahl der Hände", "type": "int", "ph": "Zahl"}], "fw": {"w": "Die Buchstaben ergeben kein Wort.", "n": "Die Zahl der Hände stimmt nicht. Schaut noch einmal auf die Tafel."}, "wrong": ["Das passt nicht. Beides muss stimmen."], "success": "Ein Wort. Es sind die Menschen, um die es geht.", "unlock": [{"kind": "fragment", "name": "DIE HÄNDE", "group": "55"}, {"kind": "story", "title": "Hintergrund (historisch): 17. November 1989", "text": "Am 17. November 1989 erinnerten Studierende an Jan Opletal, den die Nationalsozialisten 1939 ermordet hatten. Der Internationale Studententag geht darauf zurück: 1939 wurden tschechische Hochschulen geschlossen, Studentenführer hingerichtet, über tausend Studierende in Lager gebracht. Der Marsch 1989 wurde vom Jugendverband offiziell organisiert, am Nachmittag waren es etwa 15.000 Menschen. Er führte nach Vyšehrad und dann in die Innenstadt. Gegen 19:30 riegelte die Bereitschaftspolizei die Národní třída ab und schlug zu. Noch am selben Abend beschlossen Studierende und Theaterleute zu streiken. Zwei Tage später gründete sich das Bürgerforum. Die Gedenktafel an dieser Stelle erinnert an den Abend."}], "nextplace": "Band eins ist da. Hört gemeinsam zu.", "hints": ["Eine Karte nennt einen Freitag. Wann war der? (17. November)", "Die Zeithinweise zählen von Karte zu Karte weiter.", "Die Reihenfolge beginnt mit Z, E, U … Die Tafel hängt an der Fassade des Hauses an der Ecke Mikulandská/Národní."], "h": {"w": "9bec71df9aa4f6ec7c1adf07ac3af0df2811c175b7a962f445a8783db6949cfe", "n": "ee20b94b959178b719a14f89a11c6a9dd1bf9bf09bf93bd5aab783779f994d05"}}, {"id": "aud1", "kapitel": "Band eins", "title": "Ludmila am Band", "place": "Hier, an der Národní třída", "audio": "a1", "paper": "Kopfhörer teilen oder Lautsprecher", "icon": "tape", "scene": "Ludmila Ostrá hat im Frühjahr 1989 ein Band besprochen. Hört es gemeinsam an und löst, was sie am Ende fragt.", "fields": [{"id": "y", "label": "Jahreszahl", "type": "year", "ph": "JJJJ"}], "wrong": ["Das ist nicht die Jahreszahl des Steins."], "success": "Der Stein liegt. Weiter.", "unlock": [], "nextplace": "Nächster Ort: Palachovo náměstí vor der Philosophischen Fakultät, neben dem Rudolfinum.", "hints": ["Wer hat den Stein gelegt?", "Es ist die Karlsbrücke.", "Die Ziffern 1-3-5-7 am Anfang der Folge."], "h": {"y": "3139d4564a9f777ce17dc5ba4d167d81a777b1ca473e3fad583e43aed3b02279"}}, {"id": "stp", "kapitel": "Station 3", "title": "Palach", "place": "Náměstí Jana Palacha, vor der Philosophischen Fakultät", "paper": "Zeugenzettel Nr. 27 (P7)", "icon": "square", "scene": "Ein ruhiger Platz am Fluss. Jan Palach studierte an dieser Fakultät. An der linken Seite des Gebäudes seht ihr sein bronzenes Gesicht. Nehmt euch einen Moment. Dann löst den Zeugenzettel.", "fields": [{"id": "d", "label": "Datum des Tages auf dem Wenzelsplatz", "type": "date", "ph": "TT.MM.JJJJ"}], "wrong": ["Das war ein anderer Tag. Rechnet drei Tage zurück."], "success": "Ein Platz trägt seinen Namen. Danke, dass ihr euch Zeit nehmt.", "unlock": [{"kind": "note", "title": "Notiz aus der Kartei", "text": "Er war nicht der Einzige, der nicht schweigen wollte."}, {"kind": "story", "title": "Hintergrund (historisch): Jan Palach", "text": "Jan Palach wurde am 11. August 1948 in Všetaty geboren und studierte an der Karls-Universität. Am 16. Januar 1969 setzte er sich auf dem Wenzelsplatz in Brand, aus Protest gegen die Lähmung nach der Niederschlagung des Prager Frühlings. Er starb am 19. Januar 1969. Seine Briefe forderten ein Ende der Zensur und einen Generalstreik. Die Ärztin, /* ---------- SHA-256 ---------- */
function sha256hex(str){
  const K = DATA.K, Hh = DATA.H0.slice();
  const bytes = Array.from(new TextEncoder().encode(str));
  const bitLen = bytes.length * 8;
  bytes.push(0x80);
  while (bytes.length % 64 !== 56) bytes.push(0);
  const hi = Math.floor(bitLen / 4294967296), lo = bitLen >>> 0;
  bytes.push((hi>>>24)&255,(hi>>>16)&255,(hi>>>8)&255,hi&255,(lo>>>24)&255,(lo>>>16)&255,(lo>>>8)&255,lo&255);
  const w = new Array(64);
  for (let i = 0; i < bytes.length; i += 64){
    for (let t = 0; t < 16; t++) w[t] = ((bytes[i+4*t]<<24)|(bytes[i+4*t+1]<<16)|(bytes[i+4*t+2]<<8)|bytes[i+4*t+3])>>>0;
    for (let t = 16; t < 64; t++){
      const x = w[t-15], y = w[t-2];
      const s0 = ((x>>>7)|(x<<25))^((x>>>18)|(x<<14))^(x>>>3);
      const s1 = ((y>>>17)|(y<<15))^((y>>>19)|(y<<13))^(y>>>10);
      w[t] = (w[t-16] + s0 + w[t-7] + s1) >>> 0;
    }
    let a=Hh[0],b=Hh[1],c=Hh[2],d=Hh[3],e=Hh[4],f=Hh[5],g=Hh[6],h=Hh[7];
    for (let t = 0; t < 64; t++){
      const S1 = ((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7));
      const ch = (e&f)^(~e&g);
      const t1 = (h + S1 + ch + K[t] + w[t]) >>> 0;
      const S0 = ((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10));
      const mj = (a&b)^(a&c)^(b&c);
      const t2 = (S0 + mj) >>> 0;
      h=g; g=f; f=e; e=(d+t1)>>>0; d=c; c=b; b=a; a=(t1+t2)>>>0;
    }
    Hh[0]=(Hh[0]+a)>>>0; Hh[1]=(Hh[1]+b)>>>0; Hh[2]=(Hh[2]+c)>>>0; Hh[3]=(Hh[3]+d)>>>0;
    Hh[4]=(Hh[4]+e)>>>0; Hh[5]=(Hh[5]+f)>>>0; Hh[6]=(Hh[6]+g)>>>0; Hh[7]=(Hh[7]+h)>>>0;
  }
  return Hh.map(x => x.toString(16).padStart(8, "0")).join("");
}

/* ---------- Normalisierung ---------- */
function normText(s){
  s = String(s).toUpperCase().replace(/Ä/g,"AE").replace(/Ö/g,"OE").replace(/Ü/g,"UE").replace(/ß/g,"SS");
  return s.normalize("NFKD").replace(/[̀-ͯ]/g,"").replace(/[^A-Z0-9]/g,"");
}
const NUMW = {null:0,nul:0,ein:1,eins:1,eine:1,zwei:2,drei:3,vier:4,fuenf:5,"fünf":5,sechs:6,sieben:7,acht:8,neun:9,zehn:10,elf:11,zwoelf:12,"zwölf":12};
function normInt(s){
  s = String(s).trim().toLowerCase();
  if (Object.prototype.hasOwnProperty.call(NUMW, s)) return String(NUMW[s]);
  const d = s.replace(/\D/g, "");
  return d ? String(parseInt(d, 10)) : "";
}
const MON = {januar:1,jan:1,februar:2,feb:2,"märz":3,maerz:3,marz:3,mrz:3,april:4,apr:4,mai:5,juni:6,jun:6,juli:7,jul:7,august:8,aug:8,september:9,sep:9,sept:9,oktober:10,okt:10,november:11,nov:11,dezember:12,dez:12};
function pad(n){ return String(n).padStart(2, "0"); }
function normDate(s){
  s = String(s).trim().toLowerCase();
  let d, m, y, r;
  if ((r = s.match(/^(\d{4})\s*-\s*(\d{1,2})\s*-\s*(\d{1,2})$/))) { y = +r[1]; m = +r[2]; d = +r[3]; }
  else if ((r = s.match(/^(\d{1,2})\s*[.\/-]\s*(\d{1,2})\s*[.\/-]?\s*(\d{2,4})$/))) { d = +r[1]; m = +r[2]; y = +r[3]; }
  else if ((r = s.match(/^(\d{1,2})\s*\.?\s*([a-zäöü]+)\.?\s*(\d{2,4})$/)) && MON[r[2]]) { d = +r[1]; m = MON[r[2]]; y = +r[3]; }
  else return "";
  if (y < 100) y += 1900;
  if (m < 1 || m > 12 || d < 1 || d > 31) return "";
  return y + "-" + pad(m) + "-" + pad(d);
}
function normField(type, v){
  if (type === "text" || type === "sentence") return normText(v);
  if (type === "date") return normDate(v);

}

    <audio controls preload="auto" src="${esc(a.src)}">Dein Browser kann das Band nicht abspielen.</audio>
    <p class="small fb" hidden>Die Aufnahme ist nicht erreichbar. Yvonne liest den Text vor, oder ihr lest ihn unten gemeinsam.</p>
    <button type="button" class="btn ghost trbtn">Text anzeigen</button>
    <div class="trans" hidden>${tr}</div>
  </div>`;
}
function transReleased(key){
  if (gm.release[key]) return true;
  const a = st.aud[key] || {};
  if (a.err) return true;
  return !!(a.played && Date.now() - a.played >= 120000);
}
function wireAudio(root){
  root.querySelectorAll("[data-audio]").forEach(card => {
    const key = card.dataset.audio, au = card.querySelector("audio"), fb = card.querySelector(".fb");
    const tb = card.querySelector(".trbtn"), tx = card.querySelector(".trans");
    const fail = () => { st.aud[key] = Object.assign(st.aud[key]||{}, {err:true}); save(); fb.hidden = false; tx.hidden = false; tb.hidden = true; };
    au.addEventListener("error", fail);
    au.addEventListener("play", () => { if (!(st.aud[key]||{}).played){ st.aud[key] = Object.assign(st.aud[key]||{}, {played:Date.now()}); save(); } });
    setTimeout(() => { if (au.error || au.networkState === 3) fail(); }, 4000);
    tb.addEventListener("click", () => { if (transReleased(key)){ tx.hidden = !tx.hidden; tb.textContent = tx.hidden ? "Text anzeigen" : "Text verbergen"; } });
    if ((st.aud[key]||{}).err) fail();
  });
}

/* ---------- Hinweise ---------- */
function hintReadyAt(s){
  const n = st.hints[s.id] || 0;
  if (gm.release["h:"+s.id]) return 0;
  if (n === 0) return (st.since[s.id] || Date.now()) + 120000;
  return (st.lastHint[s.id] || 0) + 180000;
}
function hintsHTML(s){
  const n = st.hints[s.id] || 0;
  const shown = s.hints.slice(0, n).map(h => `<div class="hint">${esc(h)}</div>`).join("");
  const hb = n >= s.hints.length
    ? `<span>Alle Hinweise genutzt.</span>`
    : `<button type="button" class="btn ghost" id="hintbtn">Hinweis</button><span id="hintinfo"></span>`;
  const extra = (n >= s.hints.length && s.audio_hint) ? audioCard(s.audio_hint) : "";
  return `<div class="hints">${shown}<div class="hintbar">${hb}<span class="small">${n}/${s.hints.length}</span></div>${extra}</div>`;
}
function fmt(ms){ const t = Math.max(0, Math.ceil(ms/1000)); return Math.floor(t/60) + ":" + pad(t%60); }
function tick(){
  const s = stationNow();
  const b = $("#hintbtn");
  if (b){
    const left = hintReadyAt(s) - Date.now();
    const info = $("#hintinfo");
    if (left > 0){ b.disabled = true; info.textContent = "Nächster Hinweis in " + fmt(left); }
    else { b.disabled = false; info.textContent = "Bereit"; }
  }
  document.querySelectorAll("[data-audio]").forEach(card => {
    const key = card.dataset.audio, tb = card.querySelector(".trbtn");
    if (!tb || tb.hidden) return;
    if (transReleased(key)){ tb.disabled = false; }
    else {
      tb.disabled = true;
      const p = (st.aud[key]||{}).played;
      tb.textContent = p ? "Text in " + fmt(p + 120000 - Date.now()) : "Text nach dem Anhören";
    }
  });
}
setInterval(tick, 1000);

/* ---------- Ansichten ---------- */
function unlockHTML(items){
  return items.filter(u => u.kind !== "fragment").map(u =>
    `<div class="doc ${u.kind}"><div class="dk"><span>${esc(u.title)}</span><span>FIKTION</span></div><p class="tx">${esc(u.text)}</p></div>`).join("");
}
function fragHTML(items){
  return items.filter(u => u.kind === "fragment").map(u =>
    `<div class="fm"><div class="t">FUNKFRAGMENT FREIGESCHALTET</div><div class="big">${esc(u.name)} · Gruppe ${esc(u.group)}</div><p class="small">Tragt es ins Sendeblatt ein: Ereignis, Datum und Gruppenzahl.</p></div>`).join("");
}
function maxIdx(){ return st.finished ? S.length : st.cur; }
function viewIdx(){ const m = maxIdx(); return (st.view == null || st.view > m) ? m : st.view; }
function navHTML(){
  const v = viewIdx(), m = maxIdx();
  const back = v > 0 ? `<button type="button" class="btn ghost" id="nav-back">← Zurück</button>` : "";
  const fwd = v < m ? `<button type="button" class="btn ghost" id="nav-fwd">Weiter →</button>` : "";
  return (back || fwd) ? `<div class="row nav">${back}${fwd}</div>` : "";
}
function wireNav(){
  const v = viewIdx(), m = maxIdx(), b = $("#nav-back"), f = $("#nav-fwd");
  if (b) b.addEventListener("click", () => { st.view = v - 1; save(); render(); window.scrollTo({top:0}); });
  if (f) f.addEventListener("click", () => { st.view = (v + 1 >= m) ? null : v + 1; save(); render(); window.scrollTo({top:0}); });
}
function topHTML(){ return navHTML() + progressHTML(); }
function renderReview(v){
  const s = S[v], n = st.hints[s.id] || 0;
  const hs = s.hints.slice(0, n).map(h => `<div class="hint">${esc(h)}</div>`).join("");
  $("#main").innerHTML = `<div class="sheet">${topHTML()}
    <div class="kap"><span>${esc(s.kapitel)}</span><span>Rückblick</span></div>
    <h1>${esc(s.title)}</h1>
    <dl class="meta"><dt>Ort</dt><dd>${esc(s.place)}</dd><dt>Papier</dt><dd>${esc(s.paper)}</dd></dl>
    <p>${esc(s.scene)}</p>
    ${s.audio ? audioCard(s.audio) : ""}
    ${hs ? `<div class="hints">${hs}</div>` : ""}
    <p class="msg ok">${esc(s.success)}</p>
    ${fragHTML(s.unlock)}${unlockHTML(s.unlock)}
    ${s.nextplace ? `<p class="next">${esc(s.nextplace)}</p>` : ""}
  </div>`;
  wireAudio($("#main"));
}
function progressHTML(){
  return `<div class="pbar" aria-hidden="true">${S.map((s,i) => `<i class="${st.solved[s.id] ? "d" : ""}"></i>`).join("")}</div>`;
}
function renderTask(){
  const m = $("#main");
  if (st.finished){ return renderFinish(); }
  const s = stationNow();
  if (st.solved[s.id] && st.shown){
    const last = s.id === "finb";
    m.innerHTML = `<div class="sheet">
      ${topHTML()}
      <div class="kap"><span>${esc(s.kapitel)}</span><span>gelöst</span></div>
      <h1>${esc(s.title)}</h1>
      <p class="msg ok">${esc(s.success)}</p>
      ${fragHTML(s.unlock)}${unlockHTML(s.unlock)}
      ${s.nextplace ? `<p class="next">${esc(s.nextplace)}</p>` : ""}
      <button class="btn" id="go">${last ? "Zur Auflösung" : "Weiter"}</button>
    </div>`;
    $("#go").addEventListener("click", () => {
      if (last){ st.finished = true; }
      else { st.cur++; st.view = null; st.shown = false; st.since[S[st.cur].id] = Date.now(); }
      save(); render(); window.scrollTo({top:0});
    });
    return;
  }
  if (!st.since[s.id]) { st.since[s.id] = Date.now(); save(); }
  const fields = s.fields.map(f => `<label for="f-${f.id}">${esc(f.label)}
      <input type="text" id="f-${f.id}" name="${f.id}" placeholder="${esc(f.ph)}" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" ${f.type==="int"||f.type==="year" ? 'inputmode="numeric"' : ""}></label>`).join("");
  m.innerHTML = `<div class="sheet">
    ${topHTML()}
    <div class="kap"><span>${esc(s.kapitel)}</span><span>Akte 23/89</span></div>
    <h1>${esc(s.title)}</h1>
    <dl class="meta"><dt>Ort</dt><dd>${esc(s.place)}</dd><dt>Papier</dt><dd>${esc(s.paper)}</dd></dl>
    <p>${esc(s.scene)}</p>
    ${s.audio ? audioCard(s.audio) : ""}
    <form id="form" novalidate>${fields}<button class="btn" type="submit">Absenden</button><p class="msg" id="msg" role="status" aria-live="polite"></p></form>
    <div id="hintwrap">${hintsHTML(s)}</div>
  </div>`;
  wireAudio(m); wireHints(s);
  $("#form").addEventListener("submit", ev => { ev.preventDefault(); submit(s); });
  tick();
}
function wireHints(s){
  const b = $("#hintbtn");
  if (b) b.addEventListener("click", () => {
    if (hintReadyAt(s) > Date.now()) return;
    st.hints[s.id] = (st.hints[s.id]||0) + 1; st.lastHint[s.id] = Date.now(); delete gm.release["h:"+s.id]; save();
    const aBefore = document.querySelectorAll("[data-audio]").length;
    $("#hintwrap").innerHTML = hintsHTML(s); wireAudio($("#hintwrap")); wireHints(s); tick();
  });
}
function submit(s){
  const msg = $("#msg");
  const bad = [];
  let empty = false;
  s.fields.forEach(f => {
    const raw = ($("#f-"+f.id).value || "").trim();
    if (!raw){ empty = true; bad.push(f.id); return; }
    const h = sha256hex(s.id + ":" + f.id + ":" + normField(f.type, raw));
    if (h !== s.h[f.id]) bad.push(f.id);
  });
  if (empty && bad.length === s.fields.length){ msg.className = "msg"; msg.textContent = "Bitte zuerst etwas eintragen."; return; }
  if (!bad.length){
    st.solved[s.id] = true; st.shown = true; save(); render(); window.scrollTo({top:0}); return;
  }
  const texts = [];
  bad.forEach(id => { const t = (s.fw && s.fw[id]) || s.wrong[0]; if (!texts.includes(t)) texts.push(t); });
  msg.className = "msg shake"; msg.textContent = texts.join(" ");
  const form = $("#form"); form.classList.remove("shake"); void form.offsetWidth; form.classList.add("shake");
}
function renderFinish(){
  $("#main").innerHTML = `<div class="sheet">
    ${topHTML()}
    <div class="kap"><span>Epilog</span><span>keine Aufgabe mehr</span></div>
    <h1>BEFEHL 23 WIDERRUFEN</h1>
    <p class="quote">Akte öffnen. Nicht vernichten. Zeugnis geben.</p>
    <p>Die Nachricht ist angekommen, Jahrzehnte zu spät, aber vollständig. Hier steht, was wirklich geschah.</p>
    <div class="doc"><div class="dk"><span>Was wirklich geschah</span><span>FIKTION</span></div>
      <p>Die Kartei war nie eine Liste von Spitzeln, sondern eine Sammlung von Zeugen, deren Namen nur mit Einverständnis genannt werden durften.</p>
      <p>Vojtěch Kubát wollte Befehl 23 („bei Gefahr vernichten“) in der Nacht vom 23. auf den 24. November 1989 widerrufen. In Wien kam nur „Befehl 23“ an. Emir hat darauf nicht gehandelt, sondern gewartet. Am 24. November trat die Parteiführung zurück.</p>
      <p>Patricks Chronologie hat die Reihenfolge bestimmt. Selmas Register hat die Zahlen in Wörter verwandelt. Yvonnes Band hat die Sendereihenfolge genannt. Keiner von euch hätte die Botschaft allein gehabt.</p></div>
    <p class="quote">Die Nachricht wurde nie vollständig gesendet. Sie wurde vollständig, weil jemand sie zu Ende gedacht hat.</p>
    <p>Ein letztes Band ist für die Bank gedacht. Ludmila stellt euch drei Fragen. Spielt es ab, wenn die Sonne untergeht.</p>
    ${audioCard("a4")}
    <div class="doc"><div class="dk"><span>Epilog</span><span>historisch</span></div>
      <p>Das Denkmal für die Opfer des Kommunismus am Fuß des Petřín wurde 2002 enthüllt. Die Zahlen auf dem Bronzeband sind kein Ersatz für Namen, und niemand von uns weiß, was in den Karteikästen der Welt noch liegt. Die Handlung der Akte ist erfunden, das Denkmal und seine Geschichte sind es nicht.</p></div>
    <p class="small">Setzt euch. Das war die letzte Aufgabe.</p>
  </div>`;
  wireAudio($("#main"));
}
function renderAkte(){
  const frs = fragmentsOf();
  const docs = [];
  S.forEach(s => { if (st.solved[s.id]) s.unlock.filter(u => u.kind !== "fragment").forEach(u => docs.push(u)); });
  const auds = ["a1","a2"].filter(k => S.find(s => s.audio === k && st.solved[s.id]));
  const rows = frs.map(f => `<tr><td>${esc(f.name)}</td><td>${esc(f.group)}</td></tr>`).join("");
  $("#main").innerHTML = `<div class="sheet">
    <div class="kap"><span>Akte 23/89</span><span>${docs.length} Dokumente</span></div>
    <h2>Funkfragmente</h2>
    ${frs.length ? `<div style="overflow-x:auto"><table style="border-collapse:collapse;width:100%"><thead><tr><th style="text-align:left;padding:4px 8px 4px 0">Fragment</th><th style="text-align:left;padding:4px 0">Gruppe</th></tr></thead><tbody>${rows}</tbody></table></div>` : `<p class="small">Noch keine Fragmente. Das erste gibt es an der Station „Der Balkon“.</p>`}
    <h2>Dokumente</h2>
    ${docs.length ? docs.map(u => `<div class="doc ${u.kind}"><div class="dk"><span>${esc(u.title)}</span><span>FIKTION</span></div><p class="tx">${esc(u.text)}</p></div>`).join("") : `<p class="small">Noch nichts freigeschaltet.</p>`}
    ${auds.length ? `<h2>Bänder</h2>${auds.map(audioCard).join("")}` : ""}
  </div>`;
  wireAudio($("#main"));
}
function render(){
  renderFrags();
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.tab === st.tab)));
  if (st.tab === "akte") renderAkte();
  else { const v = viewIdx(); if (v < maxIdx()) renderReview(v); else if (st.finished) renderFinish(); else renderTask(); wireNav(); }
  tick();
}
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => { st.tab = t.dataset.tab; save(); render(); }));

/* ---------- Spielleitung (5 Taps auf den Titel, dann PIN) ---------- */
$("#mark").addEventListener("click", () => {
  const now = Date.now(); gm.taps = gm.taps.filter(t => now - t < 4000); gm.taps.push(now);
  if (gm.taps.length >= 5){ gm.taps = []; gm.open = !gm.open; renderGM(); }
});
function openGM(){ gm.open = !gm.open; renderGM(); if (gm.open) { const g = $("#gmslot"); if (g.scrollIntoView) g.scrollIntoView({block:"center"}); } }
$("#gmopen").addEventListener("click", openGM);
window.addEventListener("hashchange", () => { if (location.hash === "#sl") { gm.open = false; openGM(); } });
function renderGM(){
  const slot = $("#gmslot");
  if (!gm.open){ slot.innerHTML = ""; return; }
  if (!gm.ok){
    slot.innerHTML = `<div class="gm"><h3>Spielleitung</h3><label for="pin">PIN<input type="password" id="pin" inputmode="numeric" autocomplete="off"></label><button class="btn" id="pinok">Öffnen</button><p class="msg" id="pinmsg"></p></div>`;
    $("#pinok").addEventListener("click", () => {
      if (sha256hex("pin:" + $("#pin").value) === DATA.pin){ gm.ok = true; renderGM(); } else { $("#pinmsg").textContent = "Falsche PIN."; }
    });
    return;
  }
  slot.innerHTML = `<div class="gm"><h3>Spielleitung</h3>
    <p class="small">Aktuell: ${esc(stationNow().title)}${memOnly ? " (Speicher nicht verfügbar)" : ""}</p>
    <div class="row"><button class="btn ghost" id="g-hint">Hinweis jetzt freigeben</button><button class="btn ghost" id="g-skip">Station überspringen</button><button class="btn ghost" id="g-tr">Texte der Bänder freigeben</button></div>
    <label for="g-jump">Springe zu<select id="g-jump">${S.map((s,i) => `<option value="${i}" ${i===st.cur?"selected":""}>${i+1}. ${esc(s.title)}</option>`).join("")}</select></label>
    <div class="row"><button class="btn ghost" id="g-go">Springen</button><button class="btn ghost" id="g-reset">Alles zurücksetzen</button><button class="btn ghost" id="g-close">Schließen</button></div>
    <p class="msg" id="g-msg"></p></div>`;
  $("#g-hint").addEventListener("click", () => { gm.release["h:"+stationNow().id] = true; tick(); $("#g-msg").textContent = "Hinweis ist bereit."; });
  $("#g-tr").addEventListener("click", () => { ["a1","a2","a3","a4"].forEach(k => gm.release[k] = true); tick(); $("#g-msg").textContent = "Texte freigegeben."; });
  $("#g-skip").addEventListener("click", () => { const s = stationNow(); st.solved[s.id] = true; st.shown = true; st.tab = "task"; save(); render(); });
  $("#g-go").addEventListener("click", () => {
    const i = +$("#g-jump").value;
    st.solved = {}; S.forEach((s,k) => { if (k < i) st.solved[s.id] = true; });
    st.cur = i; st.view = null; st.shown = false; st.finished = false; st.since[S[i].id] = Date.now(); st.tab = "task"; save(); render();
  });
  let armed = false;
  $("#g-reset").addEventListener("click", () => {
    if (!armed){ armed = true; $("#g-reset").textContent = "Wirklich zurücksetzen?"; return; }
    st = fresh(); save(); gm.open = false; gm.ok = false; renderGM(); render();
  });
  $("#g-close").addEventListener("click", () => { gm.open = false; renderGM(); });
}
render();
if (location.hash === "#sl") { gm.open = false; openGM(); }
</script>
